# Web ContextRootPath and PortNumber Settings
server.servlet.context-path=/todaychef
server.port=8081
server.servlet.jsp.init-parameters.development=true
# DataBases
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.url=${TODAYCHEF_DB_URL:jdbc:postgresql://localhost:5432/todaychef}
spring.datasource.username=${TODAYCHEF_DB_USERNAME:postgres}
spring.datasource.password=${TODAYCHEF_DB_PASSWORD:}
# Mapper
mybatis.config-location=classpath:config/mybatis_config.xml
mybatis.mapper-locations=classpath:mapper/*.xml
# SQL init
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
# Logging
logging.level.root=INFO

# Social login redirect target (frontend)
todaychef.social.frontend-login-url=${TODAYCHEF_SOCIAL_FRONTEND_LOGIN_URL:http://localhost:3000/login}

# Google
spring.security.oauth2.client.registration.google.client-id=${TODAYCHEF_OAUTH_GOOGLE_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.google.client-secret=${TODAYCHEF_OAUTH_GOOGLE_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Naver
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.client-id=${TODAYCHEF_OAUTH_NAVER_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.naver.client-secret=${TODAYCHEF_OAUTH_NAVER_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=name,email
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# Kakao
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.client-id=${TODAYCHEF_OAUTH_KAKAO_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.kakao.client-secret=${TODAYCHEF_OAUTH_KAKAO_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=account_email,profile_nickname
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# LINE
spring.security.oauth2.client.registration.line.client-name=LINE
spring.security.oauth2.client.registration.line.client-id=${TODAYCHEF_OAUTH_LINE_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.line.client-secret=${TODAYCHEF_OAUTH_LINE_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.line.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.line.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.line.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.line.scope=openid,profile,email
spring.security.oauth2.client.provider.line.authorization-uri=https://access.line.me/oauth2/v2.1/authorize
spring.security.oauth2.client.provider.line.token-uri=https://api.line.me/oauth2/v2.1/token
spring.security.oauth2.client.provider.line.user-info-uri=https://api.line.me/v2/profile
spring.security.oauth2.client.provider.line.user-name-attribute=userId

# Yahoo (OIDC endpoint values can be overridden by env)
spring.security.oauth2.client.registration.yahoo.client-name=Yahoo
spring.security.oauth2.client.registration.yahoo.client-id=${TODAYCHEF_OAUTH_YAHOO_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.yahoo.client-secret=${TODAYCHEF_OAUTH_YAHOO_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.yahoo.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.yahoo.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.yahoo.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.yahoo.scope=openid,profile,email
spring.security.oauth2.client.provider.yahoo.authorization-uri=${TODAYCHEF_OAUTH_YAHOO_AUTH_URI:https://auth.login.yahoo.co.jp/yconnect/v2/authorization}
spring.security.oauth2.client.provider.yahoo.token-uri=${TODAYCHEF_OAUTH_YAHOO_TOKEN_URI:https://auth.login.yahoo.co.jp/yconnect/v2/token}
spring.security.oauth2.client.provider.yahoo.user-info-uri=${TODAYCHEF_OAUTH_YAHOO_USERINFO_URI:https://userinfo.yahooapis.jp/yconnect/v2/attribute}
spring.security.oauth2.client.provider.yahoo.user-name-attribute=sub
